name: Publish OTA Branches

on:
  push:
    branches:
      - development
  workflow_dispatch:
    inputs:
      channel:
        description: "OTA channel to publish"
        required: true
        default: "testingwjay"

permissions:
  contents: read

concurrency:
  group: ota-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish-ota:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Resolve OTA metadata
        id: ota-meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            channel="${{ github.event.inputs.channel }}"
          else
            case "${GITHUB_REF_NAME}" in
              development)
                channel="development"
                ;;
              *)
                echo "Unsupported branch for OTA: ${GITHUB_REF_NAME}" >&2
                exit 1
                ;;
            esac
          fi

          echo "channel=${channel}" >> "$GITHUB_OUTPUT"
          echo "ota_version=$(jq -r '.version' package.json)-ota.${channel}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "notes=Automated OTA upload for ${GITHUB_SHA} on ${channel}" >> "$GITHUB_OUTPUT"

      - name: Build frontend bundle
        run: |
          bun run build
          tar -czf frontend.tar.gz -C dist .

      - name: Sign OTA bundle
        env:
          HOTSWAP_PRIVATE_KEY: ${{ secrets.HOTSWAP_PRIVATE_KEY }}
          HOTSWAP_PRIVATE_KEY_PASSWORD: ${{ secrets.HOTSWAP_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$HOTSWAP_PRIVATE_KEY" ]]; then
            echo "::error::HOTSWAP_PRIVATE_KEY is missing; configure a Tauri signing key in GitHub Actions secrets."
            exit 1
          fi

          # Support a full minisign secret key, literal \n line breaks, or a base64
          # encoding of the full two-line key. Never print or persist key material.
          signing_key="${HOTSWAP_PRIVATE_KEY//$'\r'/}"
          if [[ "$signing_key" != 'untrusted comment:'* ]]; then
            normalized="${signing_key//\\n/$'\n'}"
            if [[ "$normalized" == 'untrusted comment:'* ]]; then
              signing_key="$normalized"
            else
              decoded="$(printf '%s' "$signing_key" | base64 --decode 2>/dev/null || true)"
              if [[ "$decoded" == 'untrusted comment:'* ]]; then
                signing_key="$decoded"
              fi
            fi
          fi

          if [[ "$signing_key" != 'untrusted comment:'* || "$signing_key" != *$'\n'* ]]; then
            echo "::error::HOTSWAP_PRIVATE_KEY must be the full two-line Tauri/minisign private key (including its 'untrusted comment:' header), or its base64 encoding."
            exit 1
          fi

          bunx tauri signer sign frontend.tar.gz -k "$signing_key" -p "${HOTSWAP_PRIVATE_KEY_PASSWORD:-}"
          unset signing_key normalized decoded

      - name: Upload OTA bundle to backend
        env:
          OTA_BACKEND_URL: ${{ secrets.OTA_BACKEND_URL }}
          OTA_BACKEND_TOKEN: ${{ secrets.OTA_BACKEND_TOKEN }}
        run: |
          BACKEND_URL="${OTA_BACKEND_URL%/}"
          RESPONSE=$(curl --fail-with-body -sS -X POST "$BACKEND_URL/api/releases" \
            -H "Authorization: Bearer $OTA_BACKEND_TOKEN" \
            -F "channel=${{ steps.ota-meta.outputs.channel }}" \
            -F "platform=all" \
            -F "arch=all" \
            -F "version=${{ steps.ota-meta.outputs.ota_version }}" \
            -F "minBinaryVersion=$(jq -r '.version' package.json)" \
            -F "signature=$(cat frontend.tar.gz.sig)" \
            -F "notes=${{ steps.ota-meta.outputs.notes }}" \
            -F "mandatory=false" \
            -F "bundleFile=@frontend.tar.gz;type=application/gzip")

          echo "$RESPONSE"